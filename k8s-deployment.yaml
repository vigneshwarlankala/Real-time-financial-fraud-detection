apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-detection-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud-detection-api
  template:
    metadata:
      labels:
        app: fraud-detection-api
    spec:
      containers:
        - name: fraud-detection-api
          image: fraud-detection-api:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: analyst-storage
              mountPath: /app/reports
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: analyst-storage
          persistentVolumeClaim:
            claimName: fraud-analyst-db-pvc
