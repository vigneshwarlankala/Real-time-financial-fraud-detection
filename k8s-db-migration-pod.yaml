apiVersion: v1
kind: Pod
metadata:
  name: fraud-db-migration
spec:
  containers:
    - name: migration
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: analyst-storage
          mountPath: /data
  volumes:
    - name: analyst-storage
      persistentVolumeClaim:
        claimName: fraud-analyst-db-pvc
  restartPolicy: Never
